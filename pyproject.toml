[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "accident-risk"
version = "0.1.0"
description = "Causal, source-independent vehicle safety research pipeline"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<4", "scipy>=1.12,<2",
  "scikit-learn>=1.5,<2", "xgboost>=2.1,<4", "pyarrow>=16,<26",
  "pydantic>=2.8,<3", "pydantic-settings>=2.4,<3", "PyYAML>=6,<7",
  "joblib>=1.4,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "matplotlib>=3.9,<4", "torch>=2.4,<3",
]

[project.optional-dependencies]
hardware = ["obd>=0.7,<1", "bleak>=0.22,<3"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
accident_risk = ["api/static/*.html", "api/static/*.css", "api/static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
